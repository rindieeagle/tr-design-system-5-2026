<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scroll Storytelling — Therapist Resources</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/colors_and_type.css" />

  <style>
    html, body {
      margin: 0; padding: 0;
      background: var(--tr-bg-base);
      color: var(--tr-text);
      font-family: var(--tr-font-body);
      overflow-x: hidden;
    }
    body {
      background-image: var(--tr-bg-radials);
      background-attachment: fixed;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 80px 48px 200px;
      display: flex; flex-direction: column; gap: 48px;
    }

    /* ---------- Hero ---------- */
    .hero { display: flex; flex-direction: column; gap: 16px; max-width: 760px; margin-bottom: 40px; }
    .eyebrow {
      font-family: var(--tr-font-mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--tr-text-accent);
    }
    .title {
      margin: 0;
      font-size: clamp(40px, 6vw, 64px);
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .lede  { margin: 0; color: var(--tr-text-70); max-width: 640px; line-height: 1.55; }

    /* ---------- Demo wrapper ---------- */
    .demo {
      background: var(--tr-surface);
      border: 1px solid var(--tr-border);
      border-radius: var(--tr-radius-2xl);
      box-shadow: var(--tr-shadow-soft);
      position: relative;
      overflow: hidden;
    }
    .demo-head {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 24px 28px 16px;
      border-bottom: 1px solid var(--tr-border);
      gap: 16px; flex-wrap: wrap;
    }
    .demo-num {
      font-family: var(--tr-font-mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--tr-text-accent);
    }
    .demo-name {
      font-family: var(--tr-font-display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.01em;
      color: var(--tr-text);
      margin: 0 auto 0 12px;
    }
    .demo-hint {
      font-size: 13px;
      color: var(--tr-text-60);
    }
    .demo-stage {
      position: relative;
      padding: 56px 32px;
      background:
        radial-gradient(at 12% 0%, rgba(6,182,212,0.05) 0px, transparent 50%),
        radial-gradient(at 88% 100%, rgba(196,181,253,0.06) 0px, transparent 50%);
    }

    .replay-btn {
      position: absolute;
      bottom: 16px; right: 20px;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      font-family: var(--tr-font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--tr-text-60);
      background: var(--tr-bg-tint);
      border: 1px solid var(--tr-border);
      border-radius: var(--tr-radius-pill);
      cursor: pointer;
      transition: color 200ms, border-color 200ms;
      z-index: 5;
    }
    .replay-btn:hover {
      color: var(--tr-text-accent);
      border-color: var(--tr-border-hi);
    }

    /* ========== 01 · SplitText Hero Reveal ========== */
    .split-stage {
      padding: 80px 32px;
      text-align: center;
    }
    .split-headline {
      margin: 0 auto;
      max-width: 720px;
      font-family: var(--tr-font-display);
      font-weight: 800;
      font-size: clamp(36px, 5.5vw, 64px);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }
    .split-line-1,
    .split-line-2 { display: block; }
    /* SplitText wraps each word in its own span (.split-word), so the
       gradient + clip have to live on the WORD, not the line wrapper. */
    .split-line-1 .split-word {
      background: var(--tr-grad-headline-light);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .split-line-2 .split-word {
      background: var(--tr-grad-primary);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .split-sub {
      margin: 18px auto 0;
      max-width: 540px;
      color: var(--tr-text-70);
      font-size: 16px;
      line-height: 1.55;
    }

    /* ========== 02 · Pinned Parallax Orbs ========== */
    .pin-spacer {
      position: relative;
      height: 1100px; /* gives the pin room to scroll through */
    }
    .pin-stage {
      position: relative;
      height: 480px;
      padding: 48px 32px;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(241,247,250,0.6));
      border-radius: var(--tr-radius-xl);
      margin: 16px;
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(28px);
      will-change: transform;
      pointer-events: none;
    }
    .orb-1 {
      width: 220px; height: 220px;
      top: 60%; left: 8%;
      background: radial-gradient(circle, rgba(6,182,212,0.55) 0%, rgba(6,182,212,0) 70%);
    }
    .orb-2 {
      width: 320px; height: 320px;
      top: 50%; left: 38%;
      background: radial-gradient(circle, rgba(125,211,252,0.55) 0%, rgba(125,211,252,0) 70%);
    }
    .orb-3 {
      width: 260px; height: 260px;
      top: 55%; left: 65%;
      background: radial-gradient(circle, rgba(196,181,253,0.55) 0%, rgba(196,181,253,0) 70%);
    }
    .pin-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 520px;
    }
    .pin-content h3 {
      margin: 0 0 12px;
      font-family: var(--tr-font-display);
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.02em;
      color: var(--tr-text);
    }
    .pin-content p {
      margin: 0;
      color: var(--tr-text-70);
      line-height: 1.55;
    }
    .pin-progress {
      position: absolute;
      left: 28px; bottom: 18px;
      font-family: var(--tr-font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--tr-text-60);
      z-index: 3;
    }
    .pin-progress span { color: var(--tr-text-accent); font-weight: 600; }

    /* ========== 03 · Card Stagger Reveal ========== */
    .stagger-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 920px;
      margin: 0 auto;
    }
    .stagger-card {
      padding: 24px;
      border-radius: var(--tr-radius-xl);
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(241,247,250,0.6));
      border: 1px solid var(--tr-border);
      box-shadow: 0 8px 24px -12px rgba(14,116,144,0.18);
      will-change: transform, opacity;
    }
    .stagger-card-eyebrow {
      display: inline-block;
      font-family: var(--tr-font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--tr-text-accent);
      background: var(--tr-bg-tint);
      padding: 4px 10px;
      border-radius: var(--tr-radius-pill);
      margin-bottom: 12px;
    }
    .stagger-card h3 {
      margin: 0 0 6px;
      font-family: var(--tr-font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--tr-text);
    }
    .stagger-card p {
      margin: 0 0 16px;
      color: var(--tr-text-70);
      font-size: 14px;
      line-height: 1.5;
    }
    .stagger-card-foot {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--tr-border);
      font-size: 13px;
    }
    .stagger-card-price {
      font-family: var(--tr-font-display);
      font-weight: 700;
      color: var(--tr-text);
    }
    .stagger-card-cta {
      color: var(--tr-text-accent);
      font-weight: 600;
    }

    /* ========== 04 · Gradient Headline Draw ========== */
    .draw-stage {
      padding: 64px 32px;
      display: flex; flex-direction: column; gap: 56px;
      max-width: 760px;
      margin: 0 auto;
    }
    .draw-h2 {
      margin: 0;
      font-family: var(--tr-font-display);
      font-weight: 800;
      font-size: clamp(32px, 4.5vw, 52px);
      letter-spacing: -0.02em;
      line-height: 1.1;
      background: var(--tr-grad-headline-light);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      display: inline-block;
      will-change: clip-path;
    }
    .draw-block + .draw-block { margin-top: 12px; }
    .draw-block p {
      margin: 12px 0 0;
      color: var(--tr-text-70);
      line-height: 1.55;
      max-width: 600px;
    }

    /* ========== 05 · Brand Mark Draw ========== */
    .mark-stage {
      padding: 80px 32px;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 32px;
      min-height: 720px;
    }
    .mark-svg {
      width: 280px; height: 280px;
    }
    .mark-svg path,
    .mark-svg line {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      will-change: stroke-dashoffset;
    }
    .mark-caption {
      text-align: center;
      max-width: 480px;
    }
    .mark-caption h3 {
      margin: 0 0 8px;
      font-family: var(--tr-font-display);
      font-weight: 700;
      font-size: 22px;
      letter-spacing: -0.01em;
      color: var(--tr-text);
    }
    .mark-caption p {
      margin: 0;
      color: var(--tr-text-70);
      font-size: 14px;
      line-height: 1.55;
    }

    /* Footer */
    .foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 0 0;
      border-top: 1px solid var(--tr-border);
      flex-wrap: wrap; gap: 12px;
      margin-top: 12px;
      color: var(--tr-text-60);
      font-size: 13px;
    }
    .foot em { font-style: normal; font-weight: 600; color: var(--tr-text-accent); }

    @media (max-width: 800px) {
      .page { padding: 48px 20px 100px; gap: 32px; }
      .demo-stage { padding: 40px 20px; }
      .stagger-grid { grid-template-columns: 1fr; }
      .pin-stage { height: 420px; padding: 32px 20px; margin: 8px; }
      .pin-spacer { height: 900px; }
      .demo-head { padding: 20px 20px 14px; }
      .replay-btn { bottom: 12px; right: 14px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module" src="/src/scroll-storytelling-main.jsx"></script>
</body>
</html>

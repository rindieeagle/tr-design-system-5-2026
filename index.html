<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TR Design System | Style Guide</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <!-- Plus Jakarta Sans Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Light Theme Variables */
            --bg-body: #F4F8FB;
            --bg-sidebar: #FFFFFF;
            --bg-active: #ECF5FA;
            --text-primary: #0F2A36;
            --text-secondary: #5A7785;
            --border-color: #E2E8F0;
            --accent: #0284C7;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --font-family: 'Plus Jakarta Sans', sans-serif;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            /* Dark Theme Variables */
            --bg-body: #0B1120;
            --bg-sidebar: #0F172A;
            --bg-active: rgba(56, 189, 248, 0.1);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --border-color: #1E293B;
            --accent: #38BDF8;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.5), 0 2px 4px -1px rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-body);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: var(--transition);
        }

        /* Sidebar Styling */
        .sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            z-index: 10;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .brand-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 4px;
        }

        /* Theme Toggle */
        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .theme-toggle:hover {
            background: var(--bg-active);
            color: var(--accent);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
        }

        .nav-section {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }

        .nav-section::-webkit-scrollbar {
            width: 6px;
        }
        .nav-section::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .nav-group-title {
            font-size: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-primary);
            margin: 20px 0 8px 12px;
        }

        .nav-group-title:first-child {
            margin-top: 4px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 8px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            cursor: pointer;
        }

        .nav-item:hover {
            background-color: rgba(0,0,0,0.02);
            color: var(--text-primary);
        }

        [data-theme="dark"] .nav-item:hover {
            background-color: rgba(255,255,255,0.03);
        }

        .nav-item.active {
            background-color: var(--bg-active);
            color: var(--accent);
            font-weight: 600;
        }

        /* Main Content Styling */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-body);
            position: relative;
        }

        .topbar {
            height: 64px;
            background-color: var(--bg-sidebar);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 24px;
            box-shadow: var(--shadow-sm);
            z-index: 5;
            transition: var(--transition);
        }

        .current-preview-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .current-preview-path {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .preview-container {
            flex: 1;
            padding: 32px;
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .preview-frame-wrapper {
            background-color: #FFFFFF; /* Keep iframe background white to match preview designs unless they are dark */
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            width: 100%;
            max-width: 1200px;
            height: 100%;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        [data-theme="dark"] .preview-frame-wrapper {
            background-color: #0F172A; /* Darker wrapper for dark mode */
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-secondary);
            text-align: center;
        }

        .empty-state svg {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        /* SVG Icons */
        .icon-sun { display: none; }
        .icon-moon { display: block; }
        
        [data-theme="dark"] .icon-sun { display: block; }
        [data-theme="dark"] .icon-moon { display: none; }

    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            <div>
                <div class="brand-title">TR Design System</div>
                <div class="brand-subtitle">Style Guide & Previews</div>
            </div>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
        <nav class="nav-section" id="nav-list">
            <!-- Dynamically populated -->
        </nav>
    </aside>

    <main class="main-content">
        <div class="topbar">
            <div class="current-preview-title" id="current-title">
                Overview
                <span class="current-preview-path" id="current-path">Select a component to preview</span>
            </div>
        </div>
        <div class="preview-container">
            <div class="preview-frame-wrapper" id="preview-wrapper">
                <div class="empty-state" id="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg>
                    <h3>Welcome to the Design System</h3>
                    <p>Select a component from the sidebar to view its preview.</p>
                </div>
                <iframe id="preview-frame" style="display: none;"></iframe>
            </div>
        </div>
    </main>

    <script>
        // List of preview files
        const previews = [
            { name: 'Buttons', file: 'buttons.html', group: 'Components' },
            { name: 'Cards', file: 'cards.html', group: 'Components' },
            { name: 'Inputs', file: 'inputs.html', group: 'Components' },
            { name: 'Brand Colors', file: 'colors-brand.html', group: 'Tokens' },
            { name: 'Logo Colors', file: 'colors-logo.html', group: 'Tokens' },
            { name: 'Gradients', file: 'gradients.html', group: 'Tokens' },
            { name: 'Iconography', file: 'iconography.html', group: 'Tokens' },
            { name: 'Logos', file: 'logos.html', group: 'Tokens' },
            { name: 'Radii', file: 'radii.html', group: 'Tokens' },
            { name: 'Shadows', file: 'shadows.html', group: 'Tokens' },
            { name: 'Spacing', file: 'spacing.html', group: 'Tokens' },
            { name: 'Glass Surfaces', file: 'surfaces-glass.html', group: 'Tokens' },
            { name: 'Body Typography', file: 'type-body.html', group: 'Typography' },
            { name: 'Display Typography', file: 'type-display.html', group: 'Typography' },
            { name: 'Gradient Typography', file: 'type-gradient.html', group: 'Typography' },
            { name: 'UI Kit Cards', file: 'uikit-cards.html', group: 'UI Kit' },
            { name: 'UI Kit Cards (Print)', file: 'uikit-cards-print.html', group: 'UI Kit' },
            { name: 'UI Kit Hero', file: 'uikit-hero.html', group: 'UI Kit' },
            { name: 'Mobile Bottom Sheet', file: 'mobile-bottom-sheet.html', group: 'Mobile' },
            { name: 'Mobile Card Stack', file: 'mobile-card-stack.html', group: 'Mobile' },
            { name: 'Mobile CTA Bar', file: 'mobile-cta-bar.html', group: 'Mobile' },
            { name: 'Mobile Hero', file: 'mobile-hero.html', group: 'Mobile' },
            { name: 'Mobile Inputs', file: 'mobile-inputs.html', group: 'Mobile' },
            { name: 'Mobile Nav', file: 'mobile-nav.html', group: 'Mobile' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const navList = document.getElementById('nav-list');
            const iframe = document.getElementById('preview-frame');
            const emptyState = document.getElementById('empty-state');
            const currentTitle = document.getElementById('current-title');
            const currentPath = document.getElementById('current-path');
            const themeToggle = document.getElementById('theme-toggle');

            // Theme Management
            const savedTheme = localStorage.getItem('tr-ds-theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);

            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('tr-ds-theme', newTheme);
            });

            // Group previews
            const groups = previews.reduce((acc, curr) => {
                if (!acc[curr.group]) acc[curr.group] = [];
                acc[curr.group].push(curr);
                return acc;
            }, {});

            // Render navigation
            Object.keys(groups).forEach(groupName => {
                const title = document.createElement('div');
                title.className = 'nav-group-title';
                title.textContent = groupName;
                navList.appendChild(title);

                groups[groupName].forEach(item => {
                    const link = document.createElement('a');
                    link.className = 'nav-item';
                    link.textContent = item.name;
                    link.dataset.file = item.file;
                    
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        
                        // Update active state
                        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                        link.classList.add('active');
                        
                        // Update UI
                        currentTitle.innerHTML = `${item.name} <span class="current-preview-path" id="current-path">preview/${item.file}</span>`;
                        
                        // Load iframe
                        emptyState.style.display = 'none';
                        iframe.style.display = 'block';
                        iframe.src = `preview/${item.file}`;
                    });
                    
                    navList.appendChild(link);
                });
            });
        });
    </script>
</body>
</html>

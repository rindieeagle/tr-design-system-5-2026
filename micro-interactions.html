<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Micro-interactions — Therapist Resources</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/colors_and_type.css" />

  <style>
    html, body {
      margin: 0; padding: 0;
      min-height: 100vh;
      background: var(--tr-bg-base);
      color: var(--tr-text);
      font-family: var(--tr-font-body);
      overflow-x: hidden;
    }
    body {
      background-image: var(--tr-bg-radials);
      background-attachment: fixed;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 80px 48px 160px;
      display: flex; flex-direction: column; gap: 40px;
    }

    /* Hero */
    .hero { display: flex; flex-direction: column; gap: 12px; max-width: 760px; margin-bottom: 24px; }
    .eyebrow {
      font-family: var(--tr-font-mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--tr-text-accent);
    }
    .title { margin: 0; font-size: clamp(40px, 6vw, 64px); letter-spacing: -0.02em; }
    .lede  { margin: 0; color: var(--tr-text-70); max-width: 640px; text-wrap: pretty; line-height: 1.55; }

    /* Demo stage */
    .demo {
      background: var(--tr-surface);
      border: 1px solid var(--tr-border);
      border-radius: var(--tr-radius-2xl);
      box-shadow: var(--tr-shadow-soft);
      position: relative;
      overflow: hidden;
    }
    .demo-head {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 24px 28px 16px;
      border-bottom: 1px solid var(--tr-border);
      gap: 16px; flex-wrap: wrap;
    }
    .demo-num {
      font-family: var(--tr-font-mono);
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--tr-text-accent);
    }
    .demo-name {
      font-family: var(--tr-font-display);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.01em;
      color: var(--tr-text);
      margin: 0 auto 0 12px;
    }
    .demo-hint {
      font-size: 13px;
      color: var(--tr-text-60);
    }
    .demo-stage {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      padding: 64px 32px;
      min-height: 240px;
      background:
        radial-gradient(at 12% 0%, rgba(6,182,212,0.06) 0px, transparent 50%),
        radial-gradient(at 88% 100%, rgba(196,181,253,0.07) 0px, transparent 50%);
    }

    /* Replay button (shared) */
    .replay-btn {
      position: absolute;
      bottom: 16px; right: 20px;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      font-family: var(--tr-font-mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--tr-text-60);
      background: var(--tr-bg-tint);
      border: 1px solid var(--tr-border);
      border-radius: var(--tr-radius-pill);
      cursor: pointer;
      transition: color 200ms, border-color 200ms;
    }
    .replay-btn:hover {
      color: var(--tr-text-accent);
      border-color: var(--tr-border-hi);
    }

    /* ========== 01 · Glass Shimmer Sweep ========== */
    .shimmer-card {
      position: relative;
      overflow: hidden;
      width: 320px;
      padding: 24px;
      border-radius: var(--tr-radius-xl);
      background: linear-gradient(180deg, rgba(255,255,255,0.85), rgba(241,247,250,0.65));
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(125,211,252,0.35);
      box-shadow: 0 12px 40px -16px rgba(14,116,144,0.25);
    }
    .shimmer-strip {
      position: absolute;
      top: -20%; left: 0;
      width: 45%;
      height: 140%;
      transform: skewX(-22deg);
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0) 0%,
        rgba(255,255,255,0.55) 45%,
        rgba(125,211,252,0.45) 55%,
        rgba(255,255,255,0) 100%
      );
      pointer-events: none;
      mix-blend-mode: screen;
      will-change: transform, opacity;
    }
    .shimmer-badge {
      display: inline-block;
      font-family: var(--tr-font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--tr-text-accent);
      background: var(--tr-bg-tint);
      padding: 4px 10px;
      border-radius: var(--tr-radius-pill);
      margin-bottom: 12px;
    }
    .shimmer-card h3 {
      margin: 0 0 4px;
      font-family: var(--tr-font-display);
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--tr-text);
    }
    .shimmer-card p {
      margin: 0 0 20px;
      color: var(--tr-text-70);
      font-size: 14px;
    }
    .shimmer-row {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid var(--tr-border);
    }
    .shimmer-price {
      font-family: var(--tr-font-display);
      font-weight: 700;
      font-size: 22px;
      color: var(--tr-text);
    }
    .shimmer-cta {
      font-size: 14px;
      font-weight: 600;
      color: var(--tr-text-accent);
    }

    /* ========== 02 · Liquid CTA Wash ========== */
    .liquid-cta {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 16px 36px;
      border: none; cursor: pointer;
      border-radius: var(--tr-radius-pill);
      font-family: var(--tr-font-display);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.005em;
      color: #fff;
      background: linear-gradient(
        90deg,
        #0E7490 0%,
        #06B6D4 25%,
        #7DD3FC 50%,
        #06B6D4 75%,
        #0E7490 100%
      );
      background-size: 300% 100%;
      background-position: 0% 50%;
      box-shadow: 0 10px 28px -8px rgba(6,182,212,0.45);
      transition: box-shadow 250ms;
    }
    .liquid-cta:hover {
      box-shadow: 0 14px 36px -8px rgba(6,182,212,0.55);
    }

    /* ========== 03 · Icon Morph ========== */
    .icon-morph-btn {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 22px;
      cursor: pointer;
      border-radius: var(--tr-radius-pill);
      font-family: var(--tr-font-display);
      font-size: 15px;
      font-weight: 600;
      color: var(--tr-text);
      background: var(--tr-surface);
      border: 1px solid var(--tr-border-hi);
      box-shadow: var(--tr-shadow-soft);
      transition: color 200ms, border-color 200ms, background 200ms;
    }
    .icon-morph-btn svg {
      width: 22px; height: 22px;
      color: currentColor;
    }
    .icon-morph-btn.is-saved {
      color: #fff;
      background: var(--tr-grad-primary);
      border-color: transparent;
    }

    /* ========== 04 · Stat Counter ========== */
    .stat-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      width: 100%;
      max-width: 720px;
    }
    .stat-cell {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 28px 16px;
      border-radius: var(--tr-radius-xl);
      background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(241,247,250,0.6));
      border: 1px solid var(--tr-border);
    }
    .stat-value {
      font-family: var(--tr-font-display);
      font-weight: 800;
      font-size: clamp(36px, 5vw, 56px);
      letter-spacing: -0.03em;
      line-height: 1;
      background: var(--tr-grad-roadmap);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-size: 13px;
      color: var(--tr-text-70);
      text-align: center;
    }

    /* ========== 05 · Price Ticker ========== */
    .price-card {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      padding: 36px 56px;
      border-radius: var(--tr-radius-xl);
      background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(241,247,250,0.6));
      border: 1px solid var(--tr-border);
    }
    .price-display {
      display: inline-flex; align-items: flex-start;
      font-family: var(--tr-font-display);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .price-currency,
    .price-digit {
      background: var(--tr-grad-roadmap);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .price-currency {
      font-size: 36px;
      padding-top: 8px;
      margin-right: 4px;
    }
    .price-digit-wrap {
      display: inline-block;
      height: 64px;
      overflow: hidden;
      vertical-align: top;
    }
    .price-digit-col {
      display: flex; flex-direction: column;
      will-change: transform;
    }
    .price-digit {
      display: block;
      height: 64px;
      font-size: 64px;
      line-height: 64px;
      text-align: center;
    }
    .price-meta {
      font-size: 13px;
      color: var(--tr-text-60);
    }

    /* Foot */
    .foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 24px 0 0;
      border-top: 1px solid var(--tr-border);
      flex-wrap: wrap; gap: 12px;
      margin-top: 12px;
      color: var(--tr-text-60);
      font-size: 13px;
    }
    .foot em { font-style: normal; font-weight: 600; color: var(--tr-text-accent); }

    @media (max-width: 800px) {
      .page { padding: 48px 20px 100px; gap: 28px; }
      .demo-stage { padding: 48px 20px; }
      .stat-row { grid-template-columns: 1fr; gap: 16px; }
      .demo-head { padding: 20px 20px 14px; }
      .replay-btn { bottom: 12px; right: 14px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module" src="/src/micro-interactions-main.jsx"></script>
</body>
</html>
